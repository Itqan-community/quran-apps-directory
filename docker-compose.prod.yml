# Production stack: app + nginx (TLS) + certbot (Cloudflare DNS-01).
# The database and object storage live OUTSIDE this stack — in production a
# MANAGED Postgres (must have the pgvector extension available) and Cloudflare
# R2. To test the setup locally, run those two as plain docker containers and
# point .env.prod at them — see docs/deploy-docker.md "Local dry-run".
#
# Usage (from the repo root):
#   cp .env.prod.example .env.prod   # fill everything in
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# The --env-file is needed twice over: it feeds compose-level interpolation
# (DOMAIN, build args) AND, via env_file, the app container's runtime env.
#
# Top-level name gives the prod stack its own compose project (containers
# qad-prod-*, volumes qad-prod_*) so it can never recreate/conflict with the
# dev stack (docker-compose.yml), which keeps the directory-name project.

name: qad-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only: prerendering touches the DB from the build stage.
        # BUILD_DATABASE_URL lets a machine that cannot resolve DATABASE_URL's
        # host at build time (e.g. a dev box, where that host is a container on
        # the compose network) point the prerender at the db's host-mapped
        # port. On the VPS it stays unset and DATABASE_URL is used directly.
        DATABASE_URL: ${BUILD_DATABASE_URL:-${DATABASE_URL}}
        # Opt-in schema provisioning: 1 applies the pgvector extension +
        # `drizzle-kit push` (db/schema.ts) before `next build`, which is
        # required on the first deploy — the prerender reads the DB. Set it back
        # to 0 afterwards; see docs/deploy-docker.md.
        PROVISION_DB: ${PROVISION_DB:-0}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    env_file: .env.prod
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  nginx:
    image: nginx:bookworm
    depends_on:
      app:
        condition: service_started
    ports:
      # Defaults are the real ports; overridable for a local dry-run when
      # something else already owns 80/443 on the machine.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Static config — no envsubst/template processing.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # First-boot self-signed certificate (sourced by nginx's own entrypoint).
      - ./nginx/self-signed-cert.sh:/docker-entrypoint.d/self-signed-cert.sh:ro
      # Certs persist on the host in ./certbot/letsencrypt (git-ignored); nginx
      # needs write access because self-signed-cert.sh drops the initial pair.
      - ./certbot/letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    build:
      context: ./certbot
    depends_on:
      nginx:
        condition: service_started
    env_file: .env.prod
    environment:
      NGINX_CONTAINER: nginx
    volumes:
      - ./certbot/letsencrypt:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
