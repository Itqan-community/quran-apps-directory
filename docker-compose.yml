services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qad
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
  minio:
    # MinIO removed the free community images from Docker Hub in 2025 (repo
    # 404s; quay needs auth) — archived Bitnami build, cached locally. It
    # stores data under /bitnami/minio/data (same object format as before) and
    # has the console embedded on :9001.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: qad
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]   # dev only — host-side next dev producer enqueues over localhost:6379
    volumes: [redis-data:/data]
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: Dockerfile, target: worker }
    # SLACK_WEBHOOK_URL (and anything else the worker needs at runtime)
    # comes from the shared dev .env; the explicit environment: entries below
    # override env_file (compose precedence) where the container-network
    # values differ from the host-side ones. required: false — a fresh clone
    # has no .env (README convention is .env.local) and config must not
    # hard-fail without one. (List-of-objects form: this compose version
    # rejects a bare single object for env_file.)
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/qad   # service-network host, NOT localhost
      REDIS_URL: redis://redis:6379
      DIGEST_PENDING_SUBMISSIONS_CRON: "0 9 */3 * *"
      # Digest review buttons must point at the dev site, not a prod URL that
      # might sit in .env.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on: [redis]
    restart: unless-stopped
volumes:
  pgdata:
  miniodata:
  redis-data:
