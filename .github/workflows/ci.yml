name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qad_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/qad_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/qad_test
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # drizzle-kit push creates columns/tables but not extensions; the fresh
      # pgvector image needs the extension enabled or the push fails with
      # `type "vector" does not exist` (SQLSTATE 42704).
      - run: DATABASE_URL=$TEST_DATABASE_URL node --experimental-strip-types db/enable-pgvector.ts
      - run: npx drizzle-kit push --force
      - run: npm test
